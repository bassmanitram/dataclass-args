repos:
  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-docstring-first

  # Formatters and linters run from the locked uv environment, so uv.lock is
  # the single source of tool versions (black, isort, flake8)
  - repo: local
    hooks:
      - id: black
        name: black
        entry: uv run --frozen black
        language: system
        types: [python]
      - id: isort
        name: isort
        entry: uv run --frozen isort
        language: system
        types: [python]
        args: [--profile=black]
      - id: flake8
        name: flake8
        entry: uv run --frozen flake8
        language: system
        types: [python]
        args: [--max-line-length=88, --max-cognitive-complexity=10]
