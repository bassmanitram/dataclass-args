name: Code Quality

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop
      - 'feature/**'

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up uv with Python 3.12
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        python-version: "3.12"

    - name: Install dependencies
      run: uv sync --locked

    - name: Run pre-commit hooks
      run: |
        uv run pre-commit run --all-files

    - name: Security check with bandit
      run: |
        uv run bandit -r dataclass_args/ -f json -o bandit-report.json || true
        uv run bandit -r dataclass_args/ -f txt || true

    - name: Upload bandit report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: bandit-report
        path: bandit-report.json
        if-no-files-found: warn

    - name: Check package build
      run: |
        uv build
        uv run twine check dist/*

    - name: Test package installation
      run: |
        WHEEL=$(realpath dist/*.whl)
        cd /tmp
        uv run --no-project --isolated --with "$WHEEL" python -c "import dataclass_args; print('Package installed successfully')"
