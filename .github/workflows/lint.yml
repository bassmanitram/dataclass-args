name: Lint

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop
      - 'feature/**'

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up uv with Python 3.12
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        python-version: "3.12"

    - name: Install dependencies
      run: uv sync --locked

    - name: Lint with black
      run: |
        uv run black --check --diff dataclass_args/ tests/ examples/

    - name: Sort imports with isort
      run: |
        uv run isort --check-only --diff dataclass_args/ tests/ examples/

    - name: Type check with mypy
      run: |
        uv run mypy --python-version=3.11 dataclass_args/

    - name: Check package metadata
      run: |
        uv build
        uv run twine check dist/*
