name: Examples

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop
      - 'feature/**'

jobs:
  test-examples:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.14"]

    steps:
    - uses: actions/checkout@v7

    - name: Set up uv with Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync --locked --no-dev --all-extras

    - name: Run examples
      run: uv run --no-sync scripts/run_examples.sh
