name: Test

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop
      - 'feature/**'

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v7

    - name: Set up uv with Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync --locked --all-extras

    - name: Test with pytest
      run: |
        uv run pytest tests/ --cov=dataclass_args --cov-report=xml --cov-report=term-missing

  # Runs the suite against the lowest versions of the project's own declared
  # dependencies (the runtime extras). Dev tools stay at their locked versions:
  # --inexact keeps them installed, and --no-dev stops them being re-resolved
  # into the environment. A failure here means a declared minimum is not
  # actually supported.
  lowest-deps:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up uv with Python 3.11
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        python-version: "3.11"

    - name: Install locked dev tools
      run: uv sync --locked --all-extras

    - name: Install the lowest declared runtime dependencies
      run: uv sync --inexact --no-dev --all-extras --resolution lowest-direct

    - name: Show runtime dependency versions
      run: uv pip list

    - name: Test with pytest
      run: |
        uv run --no-sync pytest tests/ --cov=dataclass_args --cov-report=term-missing
