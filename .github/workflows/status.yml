name: Project Status

on:
  schedule:
    # Run daily at 8 AM UTC
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  status:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up uv with Python 3.12
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        python-version: "3.12"

    - name: Install dependencies
      run: uv sync --locked --all-extras

    - name: Run comprehensive tests
      run: |
        uv run pytest tests/ -v --cov=dataclass_args --cov-report=term-missing

    - name: Check code quality
      run: |
        uv run black --check dataclass_args/ tests/ examples/
        uv run isort --check-only dataclass_args/ tests/ examples/
        uv run mypy --python-version 3.11 dataclass_args/
        uv run flake8 dataclass_args/

    - name: Test examples
      run: |
        cd examples
        uv run python basic_example.py --name "StatusTest" --count 1
        uv run python advanced_example.py --name "StatusTest" --no-debug

    - name: Package health check
      run: |
        uv build
        uv run twine check dist/*
        WHEEL=$(realpath dist/*.whl)
        cd /tmp
        uv run --no-project --isolated --with "$WHEEL" python -c "
        import dataclass_args
        print(f'Package version: {dataclass_args.__version__}')
        print('All imports successful')
        "

    - name: Generate status report
      run: |
        {
          echo "# Project Status Report"
          echo "Generated: $(date)"
          echo ""
          echo "## Test Results"
        } > status-report.md
        uv run pytest tests/ --tb=no -q >> status-report.md 2>&1 || true
        {
          echo ""
          echo "## Package Information"
        } >> status-report.md
        uv run python -c "
        import dataclass_args
        print(f'Version: {dataclass_args.__version__}')
        print(f'Available functions: {len([x for x in dir(dataclass_args) if not x.startswith(\"_\")])}')
        " >> status-report.md

    - name: Upload status report
      uses: actions/upload-artifact@v7
      with:
        name: status-report
        path: status-report.md
